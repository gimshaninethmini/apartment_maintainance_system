{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Login - Apartment Maintenance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('/static/images/apartment-bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Dark overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 0;
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 15px;
        }

        .login-box {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            border: 8px solid #d0d0d0;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 55px;
            font-weight: 700;
            color: #1a365d;
            margin-bottom: -5px;
            letter-spacing: 0px;
        }

        .login-header p {
            font-size: 14px;
            color: #888;
            font-weight: 500;
            margin-top: -5px;
            display: block;
            white-space: nowrap;
            width: 100%;
            text-align: center;
        }

        /* Input group */
        .input-group {
            margin-bottom: 22px;
            display: block;
        }

        .input-group label {
            display: block !important;
            margin-bottom: 8px !important;
            font-weight: 600;
            color: #333;
            font-size: 14px;
            width: 100%;
            clear: both;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            color: #999;
            font-size: 15px;
            z-index: 2;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            border: 2px solid #d0d0d0;
            border-radius: 25px;
            font-size: 14px;
            transition: all 0.3s;
            background: #f8f9fa;
            display: block;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            cursor: pointer;
            color: #999;
            font-size: 15px;
            z-index: 2;
        }

        .password-toggle:hover {
            color: #1a365d;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #1a365d;
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: scale(1.02);
            opacity: 0.95;
            background: #142c4a;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #666;
        }

        .register-link a {
            color: #1a365d;
            text-decoration: none;
            font-weight: 500;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* Alert messages */
        .alert {
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 13px;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div style="display: flex; align-items: center; justify-content: center; gap: 12px;">
                    <div style="display: inline-block; background: linear-gradient(135deg, #1e3a8a, #60a5fa); -webkit-background-clip: text; background-clip: text; color: transparent;">
                        <i class="fas fa-tools" style="font-size: 40px;"></i>
                    </div>
                    <h1 style="margin: 0;">FixIt</h1>
                </div>
                <div style="text-align: center;">
                    <p>Apartment Maintenance</p>
                </div>
            </div>

            <!-- Display error/success messages -->
           {% if messages %}
               {% for message in messages %}
                   <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}success{% endif %}">
                      {% if message.tags == 'error' %}
                         <i class="fas fa-times-circle me-2"></i>
                      {% else %}
                         <i class="fas fa-check-circle me-2"></i>
                      {% endif %}
                      {{ message }}
                   </div>
               {% endfor %}
           {% endif %}

            <form method="post">
                {% csrf_token %}
                
                <!-- Username field -->
                <div class="input-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" name="username" id="username" placeholder="Enter your username" required>
                    </div>
                </div>

                <!-- Password field -->
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" name="password" id="password" placeholder="Enter your password" required>
                        <i class="fas fa-eye password-toggle" id="togglePassword"></i>
                    </div>
                </div>

                <button type="submit" class="btn-login">Login</button>
            </form>

            <div class="register-link">
                Don't have an account? <a href="/register/">Register here</a>
            </div>
        </div>
    </div>

    <script>
        // Toggle password visibility
        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');

        togglePassword.addEventListener('click', function() {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
