{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Register - Apartment Maintenance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <style>
        body {
            background-image: url('/static/images/apartment-bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        /* Dark overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }
        
        .auth-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 1;
        }
        
        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .register-header h2 {
            color: #2b2d42;
            font-size: 28px;
        }
        
        .btn-register {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            width: 100%;
            padding: 12px;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            font-size: 16px;
        }
        
        .btn-register:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }
        
        .alert {
            border-radius: 10px;
            margin-bottom: 20px;
            padding: 12px;
            border: none;
        }
        
        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }
        
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }
        
        .alert i {
            margin-right: 8px;
        }
        
        .form-control {
            border-radius: 8px;
            border: 1px solid #ddd;
            padding: 10px;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
        }
        
        .form-label {
            font-weight: 600;
            color: #2b2d42;
        }
        
        @media (max-width: 768px) {
            .auth-card {
                margin: 20px;
                padding: 25px;
            }
        }
    </style>
</head>
<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh;">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Register New Account</h3>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="username">Username</label>
                                <input type="text" id="username" name="username" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="password1">Password</label>
                                <input type="password" id="password1" name="password1" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="password2">Confirm Password</label>
                                <input type="password" id="password2" name="password2" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="role">Role</label>
                                <select id="role" name="role" class="form-control">
                                    <option value="tenant">Tenant</option>
                                    <option value="manager">Property Manager</option>
                                    <option value="technician">Technician</option>
                                </select>
                            </div>
                            <div class="mb-3" id="apartmentField">
                                <label for="apartment_number">Apartment Number <span class="text-danger" id="aptRequired">*</span></label>
                                <input type="text" name="apartment_number" id="apartment_number" class="form-control">
                                <small class="text-muted" id="aptHint">Required for tenants</small>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Register</button>
                        </form>
                        <div class="mt-3 text-center">
                            <a href="{% url 'login' %}">Already have an account? Login</a>
                        </div>
                    </div>
                </div>
            </div>
            
            <button type="submit" class="btn btn-register">
                <i class="fas fa-user-plus"></i> Register
            </button>
        </form>
        
        <div class="text-center mt-3">
            <p>Already have an account? <a href="/">Login here</a></p>
        </div>
    </div>
<script>
    // Make apartment number required only for tenants
    const roleSelect = document.querySelector('select[name="role"]');
    const aptInput = document.getElementById('apartment_number');
    const aptRequired = document.getElementById('aptRequired');
    const aptHint = document.getElementById('aptHint');
    
    function toggleApartmentRequired() {
        if (roleSelect.value === 'tenant') {
            aptInput.required = true;
            aptRequired.style.display = 'inline';
            aptHint.style.display = 'block';
            aptHint.style.color = '#6c757d';
        } else {
            aptInput.required = false;
            aptRequired.style.display = 'none';
            aptHint.style.display = 'none';
        }
    }
    
    roleSelect.addEventListener('change', toggleApartmentRequired);
    toggleApartmentRequired(); // Run on page load
</script>
</body>
</html>
