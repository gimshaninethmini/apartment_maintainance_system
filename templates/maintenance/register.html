<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — FixIt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #F4F6FB;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Navbar ── */
        .top-navbar {
            background: #1E1E2E; padding: 0 24px;
            height: 60px; display: flex; align-items: center;
            justify-content: space-between;
        }
        .nav-brand { display: flex; align-items: center; gap: 10px; color: #fff; font-size: 17px; font-weight: 700; text-decoration: none; }
        .nav-brand .brand-icon { width: 34px; height: 34px; background: #7C3AED; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; }

        /* ── Main ── */
        .auth-wrapper {
            flex: 1; display: flex; align-items: center;
            justify-content: center; padding: 40px 16px;
        }
        .auth-card {
            background: #fff; border-radius: 16px;
            border: 1px solid #E5E7EB;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
            width: 100%; max-width: 460px;
            padding: 36px 32px;
        }
        .auth-logo {
            width: 48px; height: 48px; background: #7C3AED;
            border-radius: 12px; display: flex; align-items: center;
            justify-content: center; font-size: 20px; margin-bottom: 20px;
        }
        .auth-title { font-size: 22px; font-weight: 700; color: #111827; margin-bottom: 4px; }
        .auth-sub { font-size: 13px; color: #6B7280; margin-bottom: 28px; }

        .form-label { font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 5px; display: block; }
        .form-control, .form-select {
            font-size: 13.5px; border-radius: 8px;
            border: 1px solid #E5E7EB; padding: 10px 12px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: all 0.2s;
        }
        .form-control:focus, .form-select:focus {
            border-color: #7C3AED;
            box-shadow: 0 0 0 3px rgba(124,58,237,0.10);
            outline: none;
        }
        .input-group-text {
            background: #F9FAFB; border-color: #E5E7EB;
            color: #9CA3AF; border-radius: 8px 0 0 8px !important;
        }
        .input-group .form-control { border-radius: 0 8px 8px 0 !important; }

        /* Role selector cards */
        .role-options { display: flex; gap: 10px; margin-bottom: 4px; }
        .role-option { flex: 1; }
        .role-option input[type="radio"] { display: none; }
        .role-option label {
            display: flex; flex-direction: column; align-items: center;
            gap: 6px; padding: 12px 8px; border-radius: 10px;
            border: 2px solid #E5E7EB; cursor: pointer;
            font-size: 12px; font-weight: 600; color: #6B7280;
            transition: all 0.2s; text-align: center;
        }
        .role-option label i { font-size: 18px; color: #9CA3AF; transition: all 0.2s; }
        .role-option input[type="radio"]:checked + label {
            border-color: #7C3AED; background: #F5F3FF; color: #7C3AED;
        }
        .role-option input[type="radio"]:checked + label i { color: #7C3AED; }
        .role-option label:hover { border-color: #C4B5FD; background: #FAFAFA; }

        /* Apartment field toggle */
        #apt-field { transition: all 0.3s; }

        .btn-auth {
            background: #7C3AED; border: none; color: #fff;
            font-size: 14px; font-weight: 600; border-radius: 8px;
            padding: 11px; width: 100%; font-family: 'Plus Jakarta Sans', sans-serif;
            transition: all 0.2s; cursor: pointer; margin-top: 4px;
        }
        .btn-auth:hover { background: #6D28D9; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(124,58,237,0.3); }

        .divider { border-color: #E5E7EB; margin: 24px 0; }
        .auth-link { font-size: 13px; color: #6B7280; text-align: center; }
        .auth-link a { color: #7C3AED; font-weight: 600; text-decoration: none; }
        .auth-link a:hover { text-decoration: underline; }

        /* ── Alerts ── */
        .alert-fixit {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; border-radius: 8px;
            font-size: 13px; font-weight: 500; margin-bottom: 16px;
            border-left: 3px solid;
        }
        .alert-danger-fixit  { background: #FEF2F2; color: #B91C1C; border-color: #DC2626; }
        .alert-info-fixit    { background: #EFF6FF; color: #1D4ED8; border-color: #3B82F6; }
        .alert-success-fixit { background: #F0FDF4; color: #15803D; border-color: #16A34A; }

        /* Manager notice */
        .manager-notice {
            display: none; background: #FFFBEB; border: 1px solid #FDE68A;
            border-radius: 8px; padding: 10px 14px;
            font-size: 12.5px; color: #92400E; margin-top: 8px;
        }
        .manager-notice i { color: #F59E0B; margin-right: 6px; }
    </style>
</head>
<body>

<!-- Navbar -->
<div class="top-navbar">
    <a class="nav-brand" href="#">
        <div class="brand-icon"><i class="fas fa-tools" style="color:#fff;"></i></div>
        FixIt
    </a>
</div>

<div class="auth-wrapper">
    <div class="auth-card">

        <div class="auth-logo">
            <i class="fas fa-user-plus" style="color:#fff;"></i>
        </div>
        <div class="auth-title">Create an account</div>
        <div class="auth-sub">Join FixIt to manage your maintenance requests</div>

        <!-- Django Messages -->
        {% if messages %}
            {% for message in messages %}
            <div class="alert-fixit
                {% if message.tags == 'error' %}alert-danger-fixit
                {% elif message.tags == 'success' %}alert-success-fixit
                {% else %}alert-info-fixit{% endif %}">
                <i class="fas
                    {% if message.tags == 'error' %}fa-exclamation-circle
                    {% elif message.tags == 'success' %}fa-check-circle
                    {% else %}fa-info-circle{% endif %}"></i>
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user" style="font-size:12px;"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock" style="font-size:12px;"></i></span>
                    <input type="password" name="password1" class="form-control" placeholder="Create a password" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock" style="font-size:12px;"></i></span>
                    <input type="password" name="password2" class="form-control" placeholder="Repeat your password" required>
                </div>
            </div>

            <!-- Role Selector -->
            <div class="mb-3">
                <label class="form-label">Select Your Role</label>
                <div class="role-options">
                    <div class="role-option">
                        <input type="radio" name="role" id="role-tenant" value="tenant" checked>
                        <label for="role-tenant">
                            <i class="fas fa-home"></i>
                            Tenant
                        </label>
                    </div>
                    <div class="role-option">
                        <input type="radio" name="role" id="role-manager" value="manager">
                        <label for="role-manager">
                            <i class="fas fa-briefcase"></i>
                            Manager
                        </label>
                    </div>
                    <div class="role-option">
                        <input type="radio" name="role" id="role-technician" value="technician">
                        <label for="role-technician">
                            <i class="fas fa-tools"></i>
                            Technician
                        </label>
                    </div>
                </div>
                <div class="manager-notice" id="manager-notice">
                    <i class="fas fa-info-circle"></i>
                    Manager accounts require admin approval before you can log in.
                </div>
            </div>

            <!-- Apartment Number (tenant only) -->
            <div class="mb-4" id="apt-field">
                <label class="form-label">
                    Apartment Number
                    <span style="color:#9CA3AF;font-weight:400;">(Tenants only)</span>
                </label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-door-open" style="font-size:12px;"></i></span>
                    <input type="text" name="apartment_number" class="form-control" placeholder="e.g. 203">
                </div>
            </div>

            <button type="submit" class="btn-auth">
                <i class="fas fa-user-plus me-2"></i>Create Account
            </button>
        </form>

        <hr class="divider">
        <div class="auth-link">
            Already have an account? <a href="{% url 'login' %}">Sign in here</a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Show/hide apartment field and manager notice based on role
    const radios = document.querySelectorAll('input[name="role"]');
    const aptField = document.getElementById('apt-field');
    const managerNotice = document.getElementById('manager-notice');

    radios.forEach(radio => {
        radio.addEventListener('change', function () {
            aptField.style.display = this.value === 'tenant' ? 'block' : 'none';
            managerNotice.style.display = this.value === 'manager' ? 'block' : 'none';
        });
    });
</script>
</body>
</html>
