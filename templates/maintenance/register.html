{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Register - Apartment Maintenance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <style>
        body {
            background-image: url('/static/images/apartment-bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        /* Dark overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }
        
        .auth-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 1;
            border: 10px solid #d0d0d0; 
        }
        

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .register-header h2 {
            color: #2b2d42;
            font-size: 28px;
        }
        
        .register-header h1 {
            font-size: 70px;
            font-weight: 700;
            color: #1a365d;
            margin: 0;
            letter-spacing: 0px;
            display: inline-block;
        }

        .register-header p {
            font-size: 18px;
            color: #888;
            font-weight: 500;
            margin-top: 5px;
            text-align: center;
        }

        .btn-register {
            background: #1a365d;
            border: none;
            width: 100%;
            padding: 12px;
            color: white;
            font-weight: bold;
            border-radius: 30px;
            font-size: 16px;
        }
        
        .btn-register:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }
        
        .alert {
            border-radius: 10px;
            margin-bottom: 20px;
            padding: 12px;
            border: none;
        }
        
        /* Input group with icon inside field */
        .input-group-field {
            margin-bottom: 15px;
        }

        .input-group-field label {
            display: block !important;
            margin-bottom: 5px !important;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            color: #999;
            font-size: 16px;
            z-index: 2;
        }

        .input-wrapper input, .input-wrapper select {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid #d0d0d0;
            border-radius: 20px;
            font-size: 14px;
            transition: all 0.3s;
            background: #f8f9fa;
        }

        .input-wrapper input:focus, .input-wrapper select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        /* Red star for required fields */
        .required-star {
            color: #dc3545;
            margin-left: 3px;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }
        
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }
        
        .alert i {
            margin-right: 8px;
        }
        
        .form-control {
            border-radius: 8px;
            border: 1px solid #ddd;
            padding: 10px;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
        }
        
        .form-label {
            font-weight: 600;
            color: #2b2d42;
        }
        
        @media (max-width: 768px) {
            .auth-card {
                margin: 20px;
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="register-header">
            <div style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 10px;">
                <div class="brand-icon">
                    <i class="fas fa-tools" style="font-size: 60px; background: linear-gradient(135deg, #1a365d, #667eea); -webkit-background-clip: text; background-clip: text; color: transparent; display: inline-block;"></i>
                </div>
                <h1 style="font-size: 90px; font-weight: 700; color: #1a365d; margin: 0;">FixIt</h1>
            </div>
            <p style="font-size: 35px; color: #888; margin-top: 5px;">Register New Account</p>
        </div>
        
        <!-- Display error/success messages -->
{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
            <i class="fas fa-{% if message.tags == 'error' %}times-circle{% else %}check-circle{% endif %}"></i>
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    {% endfor %}
{% endif %}
        
        <form method="post">
            {% csrf_token %}
            <div class="input-group-field">
                <label for="username">Username </label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" name="username" id="username" placeholder="Choose a username" required>
                </div>
            </div>
            
            <div class="input-group-field">
                <label for="password1">Password </label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" name="password1" id="password1" placeholder="Create a password" required>
                </div>
                <small class="text-muted">Password must be at least 6 characters</small>
            </div>
            
            <div class="input-group-field">
                <label for="password2">Confirm Password </label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" name="password2" id="password2" placeholder="Confirm your password" required>
                </div>
            </div>
            
            <div class="input-group-field">
                <label for="role">Role </span></label>
                <div class="input-wrapper">
                    <i class="fas fa-users input-icon"></i>
                    <select name="role" id="role">
                        <option value="tenant">Tenant</option>
                        <option value="manager">Property Manager</option>
                        <option value="technician">Technician</option>
                    </select>
                </div>
            </div>
            
            <div class="input-group-field">
                <label for="apartment_number">Apartment Number (if Tenant)</label>
                <div class="input-wrapper">
                    <i class="fas fa-home input-icon"></i>
                        <input type="text" name="apartment_number" id="apartment_number" placeholder="e.g., 101, 202, 303">
                </div>
            </div>
            
            <button type="submit" class="btn btn-register">
                <i class="fas fa-user-plus"></i> Register
            </button>
        </form>
        
        <div class="text-center mt-3">
            <p>Already have an account? <a href="/" style="color: #1a365d;">Login here</a></p>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
