<!DOCTYPE html>
<html>
<head>
    <title>Register - Apartment Maintenance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh;">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Register New Account</h3>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label>Username</label>
                                <input type="text" name="username" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Password</label>
                                <input type="password" name="password1" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Confirm Password</label>
                                <input type="password" name="password2" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Role</label>
                                <select name="role" class="form-control">
                                    <option value="tenant">Tenant</option>
                                    <option value="manager">Property Manager</option>
                                    <option value="technician">Technician</option>
                                </select>
                            </div>
                            <div class="mb-3" id="apartmentField">
                                <label>Apartment Number <span class="text-danger" id="aptRequired">*</span></label>
                                <input type="text" name="apartment_number" id="apartment_number" class="form-control">
                                <small class="text-muted" id="aptHint">Required for tenants</small>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Register</button>
                        </form>
                        <div class="mt-3 text-center">
                            <a href="{% url 'login' %}">Already have an account? Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script>
    // Make apartment number required only for tenants
    const roleSelect = document.querySelector('select[name="role"]');
    const aptInput = document.getElementById('apartment_number');
    const aptRequired = document.getElementById('aptRequired');
    const aptHint = document.getElementById('aptHint');
    
    function toggleApartmentRequired() {
        if (roleSelect.value === 'tenant') {
            aptInput.required = true;
            aptRequired.style.display = 'inline';
            aptHint.style.display = 'block';
            aptHint.style.color = '#6c757d';
        } else {
            aptInput.required = false;
            aptRequired.style.display = 'none';
            aptHint.style.display = 'none';
        }
    }
    
    roleSelect.addEventListener('change', toggleApartmentRequired);
    toggleApartmentRequired(); // Run on page load
</script>
</body>
</html>
